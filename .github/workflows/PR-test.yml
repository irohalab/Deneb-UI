name: Unit Test for PR

on:
  pull_request_target:
    branches: [ master ]
    types: [labeled]

jobs:
  build:
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'Ready To Test')
    strategy:
      matrix:
        node-version: [24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
        with:
          # `pull_request_target` checks out the base branch by default. Explicitly check out
          # the PR's head so the actual proposed changes are tested. This is safe here because
          # the job only runs once a maintainer applies the `Ready To Test` label.
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install Angular CLI
        run: npm install -g @angular/cli
      - name: Install dependencies
        run: npm ci
      - name: Run Unit test
        run: |
          ng test --project @irohalab/Deneb-UI --no-watch
        env:
          CHROME_BIN: /usr/bin/google-chrome-stable
